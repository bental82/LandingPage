<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>תואר ראשון במערכות מידע ניהוליות | המרכז האקדמי פרס</title>
  <meta name="description" content="תתחילו את הקריירה שלכם בהייטק עם יתרון! תואר ראשון B.A. במערכות מידע ניהוליות במרכז האקדמי פרס עם לימודי תעודה בזמן התואר והתחייבות להשמה.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- Trust Bar -->
  <div class="trust-bar">
    <div class="container trust-bar-inner">
      <div class="trust-strip" id="trust-bar-content"></div>
    </div>
  </div>

  <!-- Hero -->
  <header class="hero" id="hero">
    <div class="hero-bg"></div>
    <div class="container hero-inner">
      <div class="hero-content" id="hero-content"></div>
    </div>
  </header>

  <!-- Main Layout -->
  <div class="page-body" id="form-section">
    <div class="container page-layout">

      <main class="main-content">
        <!-- Value Props -->
        <section class="section value-props" id="value-props-section"></section>

        <!-- Certifications -->
        <section class="section certifications-section" id="certs-section"></section>

        <!-- Accordion -->
        <section class="section accordion-section" id="accordion-section"></section>

        <!-- Stats -->
        <section class="section stats-section" id="stats-section"></section>

        <!-- Graduates -->
        <section class="section graduates-section" id="graduates-section"></section>

        <!-- Final CTA -->
        <section class="section final-cta-section" id="final-cta-section"></section>
      </main>

      <!-- Sticky Form Sidebar -->
      <aside class="form-sidebar" id="sticky-form">
        <div class="form-card" id="lead-form">
          <div class="form-header" id="form-header"></div>
          <form id="contact-form" novalidate>
            <div class="form-group">
              <label for="fullname">שם מלא</label>
              <input type="text" id="fullname" name="fullname" placeholder="שם מלא" required autocomplete="name">
            </div>
            <div class="form-group">
              <label for="phone">טלפון</label>
              <input type="tel" id="phone" name="phone" placeholder="050-0000000" required autocomplete="tel" pattern="^05[0-9]{8}$">
            </div>
            <div class="form-group">
              <label for="email">אימייל</label>
              <input type="email" id="email" name="email" placeholder="email@example.com" required autocomplete="email">
            </div>
            <button type="submit" class="form-submit-btn">
              <span class="btn-text" id="form-btn-text"></span>
              <span class="btn-sub" id="form-btn-sub"></span>
            </button>
            <p class="form-disclaimer">בשליחת הטופס אני מאשר/ת קבלת מידע מהמרכז האקדמי פרס. <a href="#">מדיניות פרטיות</a></p>
          </form>
          <div class="form-phone-alt">
            <span>אנחנו זמינים גם כאן:</span>
            <a href="" class="phone-link" id="form-phone-link"></a>
          </div>
          <div class="form-thankyou" id="form-thankyou" hidden>
            <div class="thankyou-icon">
              <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="#27ae60" stroke-width="2"><path d="M22 11.08V12a10 10 0 11-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>
            </div>
            <h3 id="thankyou-title"></h3>
            <p id="thankyou-text"></p>
          </div>
        </div>
      </aside>

    </div>
  </div>

  <!-- Mobile Sticky CTA -->
  <div class="mobile-sticky-cta" id="mobile-cta">
    <a href="#lead-form" class="cta-button mobile-cta-btn">השאירו פרטים &mdash; פטור מדמי רישום</a>
  </div>

  <!-- Footer -->
  <footer class="footer" id="footer"></footer>

  <script src="script.js"></script>
  <script>
    if (window.netlifyIdentity) {
      window.netlifyIdentity.on("init", user => {
        if (!user) window.netlifyIdentity.on("login", () => document.location.href = "/admin/");
      });
    }
  </script>
  <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
</body>
</html>
